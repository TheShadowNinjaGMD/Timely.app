<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Timely - Professional Timer &amp; Stopwatch</title>
        <link
            rel="stylesheet"
            href="./Timely - Professional Timer &amp; Stopwatch_files/style.css"
        />
        <!-- snd-lib for sounds -->
        <script src="https://cdn.jsdelivr.net/gh/snd-lib/snd-lib@v1.2.4/dist/browser/snd.js?kit=01"></script>
    </head>
    <body data-theme="ocean">
        <!-- Settings Panel -->
        <div class="settings" id="settings">
            <div class="settings-panel">
                <div class="panel-header">
                    <h2>Settings</h2>
                    <button
                        class="close-btn snd__button"
                        onclick="closeSettings()"
                    >
                        ×
                    </button>
                </div>

                <div class="panel-content">
                    <!-- Theme -->
                    <div class="settings-section">
                        <h3>Color Theme</h3>
                        <div class="theme-grid">
                            <button
                                class="theme-card active snd__button"
                                data-theme="ocean"
                                onclick="setTheme('ocean')"
                            >
                                <div class="theme-swatch ocean-swatch"></div>
                                <span>Ocean</span>
                            </button>
                            <button
                                class="theme-card snd__button"
                                data-theme="sunset"
                                onclick="setTheme('sunset')"
                            >
                                <div class="theme-swatch sunset-swatch"></div>
                                <span>Sunset</span>
                            </button>
                            <button
                                class="theme-card snd__button"
                                data-theme="forest"
                                onclick="setTheme('forest')"
                            >
                                <div class="theme-swatch forest-swatch"></div>
                                <span>Forest</span>
                            </button>
                            <button
                                class="theme-card snd__button"
                                data-theme="lavender"
                                onclick="setTheme('lavender')"
                            >
                                <div class="theme-swatch lavender-swatch"></div>
                                <span>Lavender</span>
                            </button>
                            <button
                                class="theme-card snd__button"
                                data-theme="midnight"
                                onclick="setTheme('midnight')"
                            >
                                <div class="theme-swatch midnight-swatch"></div>
                                <span>Midnight</span>
                            </button>
                            <button
                                class="theme-card snd__button"
                                data-theme="rose"
                                onclick="setTheme('rose')"
                            >
                                <div class="theme-swatch rose-swatch"></div>
                                <span>Rose</span>
                            </button>
                        </div>
                    </div>

                    <!-- Visual -->
                    <div class="settings-section">
                        <h3>Visual Effects</h3>
                        <div class="toggle-row">
                            <label class="toggle-label">
                                <input
                                    type="checkbox"
                                    id="glowToggle"
                                    checked=""
                                    onchange="toggleGlow()"
                                />
                                <span class="toggle-switch"></span>
                                <div class="toggle-info">
                                    <strong>Pulsing Glow Effects</strong>
                                    <small
                                        >Animated ring and button glows</small
                                    >
                                </div>
                            </label>
                        </div>
                    </div>

                    <!-- Audio -->
                    <div class="settings-section">
                        <h3>Audio Settings</h3>
                        <div class="toggle-row">
                            <label class="toggle-label">
                                <input
                                    type="checkbox"
                                    id="soundToggle"
                                    checked=""
                                    onchange="toggleSound()"
                                />
                                <span class="toggle-switch"></span>
                                <div class="toggle-info">
                                    <strong>Sound Effects</strong>
                                    <small>Button clicks and alerts</small>
                                </div>
                            </label>
                        </div>
                        <div class="slider-box">
                            <label>
                                <span class="slider-label-row">
                                    <svg
                                        data-slot="icon"
                                        fill="none"
                                        stroke-width="1.5"
                                        stroke="currentColor"
                                        viewBox="0 0 24 24"
                                        xmlns="http://www.w3.org/2000/svg"
                                        aria-hidden="true"
                                        class="vol-icon"
                                    >
                                        <path
                                            stroke-linecap="round"
                                            stroke-linejoin="round"
                                            d="M6 13.5V3.75m0 9.75a1.5 1.5 0 0 1 0 3m0-3a1.5 1.5 0 0 0 0 3m0 3.75V16.5m12-3V3.75m0 9.75a1.5 1.5 0 0 1 0 3m0-3a1.5 1.5 0 0 0 0 3m0 3.75V16.5m-6-9V3.75m0 3.75a1.5 1.5 0 0 1 0 3m0-3a1.5 1.5 0 0 0 0 3m0 9.75V10.5"
                                        ></path>
                                    </svg>
                                    Master Volume
                                </span>
                                <span id="volText">80%</span>
                            </label>
                            <input
                                type="range"
                                id="volSlider"
                                min="0"
                                max="100"
                                value="80"
                                oninput="updateVol(this.value)"
                            />
                        </div>
                        <div class="slider-box">
                            <label>
                                <span class="slider-label-row">
                                    <svg
                                        data-slot="icon"
                                        fill="none"
                                        stroke-width="1.5"
                                        stroke="currentColor"
                                        viewBox="0 0 24 24"
                                        xmlns="http://www.w3.org/2000/svg"
                                        aria-hidden="true"
                                        class="vol-icon"
                                    >
                                        <path
                                            stroke-linecap="round"
                                            stroke-linejoin="round"
                                            d="M6 13.5V3.75m0 9.75a1.5 1.5 0 0 1 0 3m0-3a1.5 1.5 0 0 0 0 3m0 3.75V16.5m12-3V3.75m0 9.75a1.5 1.5 0 0 1 0 3m0-3a1.5 1.5 0 0 0 0 3m0 3.75V16.5m-6-9V3.75m0 3.75a1.5 1.5 0 0 1 0 3m0-3a1.5 1.5 0 0 0 0 3m0 9.75V10.5"
                                        ></path>
                                    </svg>
                                    Sound Effects
                                </span>
                                <span id="sfxText">70%</span>
                            </label>
                            <input
                                type="range"
                                id="sfxSlider"
                                min="0"
                                max="100"
                                value="70"
                                oninput="updateSFX(this.value)"
                            />
                        </div>
                    </div>

                    <!-- Study Mode -->
                    <div class="settings-section">
                        <h3>Pomodoro / Study Mode</h3>
                        <div class="toggle-row">
                            <label class="toggle-label">
                                <input
                                    type="checkbox"
                                    id="studyToggle"
                                    onchange="toggleStudyFromSettings()"
                                />
                                <span class="toggle-switch"></span>
                                <div class="toggle-info">
                                    <strong>Enable Study Mode</strong>
                                    <small
                                        >25min focus / 5min break cycles</small
                                    >
                                </div>
                            </label>
                        </div>
                        <div class="toggle-row">
                            <label class="toggle-label">
                                <input
                                    type="checkbox"
                                    id="autoBreak"
                                    checked=""
                                />
                                <span class="toggle-switch"></span>
                                <div class="toggle-info">
                                    <strong>Auto-start Breaks</strong>
                                    <small
                                        >Automatically begin break timer</small
                                    >
                                </div>
                            </label>
                        </div>
                        <div class="toggle-row">
                            <label class="toggle-label">
                                <input
                                    type="checkbox"
                                    id="musicToggle"
                                    onchange="toggleMusic()"
                                />
                                <span class="toggle-switch"></span>
                                <div class="toggle-info">
                                    <strong>Background Music</strong>
                                    <small
                                        >Ambient focus music during study</small
                                    >
                                </div>
                            </label>
                        </div>
                        <div
                            class="slider-box"
                            id="musicBox"
                            style="display: none"
                        >
                            <label>
                                <span class="slider-label-row">
                                    <svg
                                        data-slot="icon"
                                        fill="none"
                                        stroke-width="1.5"
                                        stroke="currentColor"
                                        viewBox="0 0 24 24"
                                        xmlns="http://www.w3.org/2000/svg"
                                        aria-hidden="true"
                                        class="vol-icon"
                                    >
                                        <path
                                            stroke-linecap="round"
                                            stroke-linejoin="round"
                                            d="M6 13.5V3.75m0 9.75a1.5 1.5 0 0 1 0 3m0-3a1.5 1.5 0 0 0 0 3m0 3.75V16.5m12-3V3.75m0 9.75a1.5 1.5 0 0 1 0 3m0-3a1.5 1.5 0 0 0 0 3m0 3.75V16.5m-6-9V3.75m0 3.75a1.5 1.5 0 0 1 0 3m0-3a1.5 1.5 0 0 0 0 3m0 9.75V10.5"
                                        ></path>
                                    </svg>
                                    Music Volume
                                </span>
                                <span id="musicText">40%</span>
                            </label>
                            <input
                                type="range"
                                id="musicSlider"
                                min="0"
                                max="100"
                                value="40"
                                oninput="updateMusic(this.value)"
                            />
                        </div>
                    </div>
                </div>

                <div class="panel-footer">
                    <button
                        class="btn-secondary snd__button"
                        onclick="resetSettings()"
                    >
                        Reset to Default
                    </button>
                    <button
                        class="btn-primary snd__button"
                        onclick="closeSettings()"
                    >
                        Done
                    </button>
                </div>
            </div>
        </div>

        <!-- App -->
        <div class="app">
            <!-- Navigation -->
            <nav class="nav">
                <div class="nav-tabs">
                    <button
                        class="tab-btn active snd__button"
                        id="timerTab"
                        onclick="switchMode('timer')"
                    >
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2.5"
                        >
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                        <span>Timer</span>
                    </button>
                    <button
                        class="tab-btn snd__button"
                        id="stopwatchTab"
                        onclick="switchMode('stopwatch')"
                    >
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2.5"
                        >
                            <circle cx="12" cy="13" r="9"></circle>
                            <polyline points="12 7 12 13 15 15"></polyline>
                            <path d="M9 3h6"></path>
                        </svg>
                        <span>Stopwatch</span>
                    </button>
                </div>
                <div class="nav-actions">
                    <button
                        class="action-btn snd__button"
                        onclick="toggleLightMode()"
                        title="Toggle theme"
                    >
                        <svg
                            id="lightIcon"
                            xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.5"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"
                            />
                        </svg>
                        <span id="lightLabel">Light</span>
                    </button>
                    <button
                        class="action-btn snd__button"
                        onclick="toggleMute()"
                        title="Toggle sound"
                    >
                        <svg
                            id="muteIcon"
                            xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 24 24"
                            fill="currentColor"
                        >
                            <path
                                d="M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.508c-1.141 0-2.318.664-2.66 1.905A9.76 9.76 0 0 0 1.5 12c0 .898.121 1.768.35 2.595.341 1.24 1.518 1.905 2.659 1.905h1.93l4.5 4.5c.945.945 2.561.276 2.561-1.06V4.06ZM18.584 5.106a.75.75 0 0 1 1.06 0c3.808 3.807 3.808 9.98 0 13.788a.75.75 0 0 1-1.06-1.06 8.25 8.25 0 0 0 0-11.668.75.75 0 0 1 0-1.06Z"
                            />
                            <path
                                d="M15.932 7.757a.75.75 0 0 1 1.061 0 6 6 0 0 1 0 8.486.75.75 0 0 1-1.06-1.061 4.5 4.5 0 0 0 0-6.364.75.75 0 0 1 0-1.06Z"
                            />
                        </svg>
                        <span id="muteLabel">Sound</span>
                    </button>
                    <button
                        class="action-btn snd__button"
                        onclick="openSettings()"
                    >
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 24 24"
                            fill="currentColor"
                            class="size-6"
                        >
                            <path
                                fill-rule="evenodd"
                                d="M11.078 2.25c-.917 0-1.699.663-1.85 1.567L9.05 4.889c-.02.12-.115.26-.297.348a7.493 7.493 0 0 0-.986.57c-.166.115-.334.126-.45.083L6.3 5.508a1.875 1.875 0 0 0-2.282.819l-.922 1.597a1.875 1.875 0 0 0 .432 2.385l.84.692c.095.078.17.229.154.43a7.598 7.598 0 0 0 0 1.139c.015.2-.059.352-.153.43l-.841.692a1.875 1.875 0 0 0-.432 2.385l.922 1.597a1.875 1.875 0 0 0 2.282.818l1.019-.382c.115-.043.283-.031.45.082.312.214.641.405.985.57.182.088.277.228.297.35l.178 1.071c.151.904.933 1.567 1.85 1.567h1.844c.916 0 1.699-.663 1.85-1.567l.178-1.072c.02-.12.114-.26.297-.349.344-.165.673-.356.985-.57.167-.114.335-.125.45-.082l1.02.382a1.875 1.875 0 0 0 2.28-.819l.923-1.597a1.875 1.875 0 0 0-.432-2.385l-.84-.692c-.095-.078-.17-.229-.154-.43a7.614 7.614 0 0 0 0-1.139c-.016-.2.059-.352.153-.43l.84-.692c.708-.582.891-1.59.433-2.385l-.922-1.597a1.875 1.875 0 0 0-2.282-.818l-1.02.382c-.114.043-.282.031-.449-.083a7.49 7.49 0 0 0-.985-.57c-.183-.087-.277-.227-.297-.348l-.179-1.072a1.875 1.875 0 0 0-1.85-1.567h-1.843ZM12 15.75a3.75 3.75 0 1 0 0-7.5 3.75 3.75 0 0 0 0 7.5Z"
                                clip-rule="evenodd"
                            />
                        </svg>
                        <span>Settings</span>
                    </button>
                </div>
            </nav>

            <!-- Study Banner -->
            <div class="study-banner" id="studyBanner" style="display: none">
                <div class="study-info">
                    <div class="study-phase" id="studyPhase">Focus Session</div>
                    <div class="study-session" id="studySession">Session 1</div>
                </div>
            </div>

            <!-- Main Content -->
            <main class="main">
                <div id="timerView">
                    <!-- Rendered by JS -->
                </div>
                <div id="stopwatchView" style="display: none">
                    <!-- Rendered by JS -->
                </div>
            </main>
        </div>

        <!-- Play Controls -->
        <div class="play-zone">
            <button
                class="reset-play-btn snd__button"
                id="resetBtn"
                onclick="resetApp()"
                title="Reset"
            >
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.5"
                >
                    <polyline points="23 4 23 10 17 10"></polyline>
                    <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                </svg>
            </button>
            <button
                class="play-btn snd__celebration"
                id="playBtn"
                onclick="togglePlay()"
            >
                <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor">
                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
            </button>
        </div>

        <!-- Notification -->
        <div class="notification" id="notification">
            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
            >
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            <span id="notifText">Complete!</span>
        </div>

        <!-- Audio -->
        <audio
            id="chime"
            src="https://cdn.pixabay.com/audio/2022/03/15/audio_91c6c7c6a7.mp3"
        ></audio>
        <audio
            id="bgMusic"
            loop=""
            src="https://cdn.pixabay.com/audio/2022/03/10/audio_c8c7b0f1e4.mp3"
        ></audio>

        <script src="./Timely - Professional Timer &amp; Stopwatch_files/script.js"></script>
    </body>
</html>
