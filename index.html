<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Timely</title>
        <link rel="stylesheet" href="./style.css" />
        <!-- Updated tab icon to reference the new ICO format -->
        <link rel="icon" type="image/x-icon" href="./favicon.ico" />
        <!-- snd-lib for sounds -->
        <script src="https://cdn.jsdelivr.net/gh/snd-lib/snd-lib@v1.2.4/dist/browser/snd.js?kit=01"></script>
    </head>
    <body data-theme="ocean">
        <!-- Settings Panel -->
        <div class="settings" id="settings">
            <div class="settings-panel">
                <div class="panel-header">
                    <h2>Settings</h2>
                    <button
                        class="close-btn snd__button"
                        onclick="closeSettings()"
                    >
                        ×
                    </button>
                </div>

                <div class="panel-content">
                    <!-- Theme -->
                    <div class="settings-section">
                        <h3>Color Theme</h3>
                        <div class="theme-grid">
                            <button
                                class="theme-card active snd__button"
                                data-theme="ocean"
                                onclick="setTheme('ocean')"
                            >
                                <div class="theme-swatch ocean-swatch"></div>
                                <span>Ocean</span>
                            </button>
                            <button
                                class="theme-card snd__button"
                                data-theme="sunset"
                                onclick="setTheme('sunset')"
                            >
                                <div class="theme-swatch sunset-swatch"></div>
                                <span>Sunset</span>
                            </button>
                            <button
                                class="theme-card snd__button"
                                data-theme="forest"
                                onclick="setTheme('forest')"
                            >
                                <div class="theme-swatch forest-swatch"></div>
                                <span>Forest</span>
                            </button>
                            <button
                                class="theme-card snd__button"
                                data-theme="lavender"
                                onclick="setTheme('lavender')"
                            >
                                <div class="theme-swatch lavender-swatch"></div>
                                <span>Lavender</span>
                            </button>
                            <button
                                class="theme-card snd__button"
                                data-theme="midnight"
                                onclick="setTheme('midnight')"
                            >
                                <div class="theme-swatch midnight-swatch"></div>
                                <span>Midnight</span>
                            </button>
                            <button
                                class="theme-card snd__button"
                                data-theme="rose"
                                onclick="setTheme('rose')"
                            >
                                <div class="theme-swatch rose-swatch"></div>
                                <span>Rose</span>
                            </button>
                            <button
                                class="theme-card snd__button"
                                data-theme="candy"
                                onclick="setTheme('candy')"
                            >
                                <div class="theme-swatch candy-swatch"></div>
                                <span>Candy</span>
                            </button>
                            <button
                                class="theme-card snd__button"
                                data-theme="gold"
                                onclick="setTheme('gold')"
                            >
                                <div class="theme-swatch gold-swatch"></div>
                                <span>Gold</span>
                            </button>
                            <button
                                class="theme-card snd__button"
                                data-theme="slate"
                                onclick="setTheme('slate')"
                            >
                                <div class="theme-swatch slate-swatch"></div>
                                <span>Slate</span>
                            </button>
                            <button
                                class="theme-card snd__button"
                                data-theme="cherry"
                                onclick="setTheme('cherry')"
                            >
                                <div class="theme-swatch cherry-swatch"></div>
                                <span>Cherry</span>
                            </button>
                            <button
                                class="theme-card snd__button"
                                data-theme="mint"
                                onclick="setTheme('mint')"
                            >
                                <div class="theme-swatch mint-swatch"></div>
                                <span>Mint</span>
                            </button>
                            <button
                                class="theme-card snd__button"
                                data-theme="tangerine"
                                onclick="setTheme('tangerine')"
                            >
                                <div
                                    class="theme-swatch tangerine-swatch"
                                ></div>
                                <span>Tangerine</span>
                            </button>
                            <button
                                class="theme-card snd__button"
                                data-theme="nebula"
                                onclick="setTheme('nebula')"
                            >
                                <div class="theme-swatch nebula-swatch"></div>
                                <span>Nebula</span>
                            </button>
                            <button
                                class="theme-card snd__button"
                                data-theme="autumn"
                                onclick="setTheme('autumn')"
                            >
                                <div class="theme-swatch autumn-swatch"></div>
                                <span>Autumn</span>
                            </button>
                            <button
                                class="theme-card snd__button"
                                data-theme="arctic"
                                onclick="setTheme('arctic')"
                            >
                                <div class="theme-swatch arctic-swatch"></div>
                                <span>Arctic</span>
                            </button>
                            <button
                                class="theme-card snd__button"
                                data-theme="neon"
                                onclick="setTheme('neon')"
                            >
                                <div class="theme-swatch neon-swatch"></div>
                                <span>Neon</span>
                            </button>
                            <button
                                class="theme-card snd__button"
                                data-theme="coffee"
                                onclick="setTheme('coffee')"
                            >
                                <div class="theme-swatch coffee-swatch"></div>
                                <span>Coffee</span>
                            </button>
                            <button
                                class="theme-card snd__button"
                                data-theme="plum"
                                onclick="setTheme('plum')"
                            >
                                <div class="theme-swatch plum-swatch"></div>
                                <span>Plum</span>
                            </button>
                            <button
                                class="theme-card snd__button"
                                data-theme="coral"
                                onclick="setTheme('coral')"
                            >
                                <div class="theme-swatch coral-swatch"></div>
                                <span>Coral</span>
                            </button>
                            <button
                                class="theme-card snd__button"
                                data-theme="custom"
                                onclick="openCustomTheme()"
                            >
                                <div class="theme-swatch custom-swatch"></div>
                                <span>Custom</span>
                            </button>
                        </div>
                        <!-- Custom Theme Editor -->
                        <div class="theme-editor" id="themeEditor">
                            <h4>Customize Your Theme</h4>
                            <!-- Color wheel trigger for accent color -->
                            <div class="cw-trigger-row">
                                <label>Accent</label>
                                <button
                                    class="cw-trigger-btn"
                                    onclick="openColorWheel()"
                                >
                                    <div
                                        class="cw-trigger-swatch"
                                        id="cwTriggerSwatch"
                                        style="background: #5b8fd9"
                                    ></div>
                                    <span id="cwTriggerText">#5b8fd9</span>
                                    <svg
                                        class="cw-wheel-icon"
                                        viewBox="0 0 24 24"
                                        fill="none"
                                        stroke="currentColor"
                                        stroke-width="2"
                                    >
                                        <circle cx="12" cy="12" r="10" />
                                        <path d="M12 2a10 10 0 0 1 10 10" />
                                        <path d="M12 2v10l-6 6" />
                                    </svg>
                                </button>
                            </div>
                            <div class="color-picker-grid">
                                <div class="color-picker-item">
                                    <label>Background</label>
                                    <input
                                        type="color"
                                        id="cBg"
                                        value="#0f1419"
                                    />
                                </div>
                                <div class="color-picker-item">
                                    <label>Surface</label>
                                    <input
                                        type="color"
                                        id="cElevated"
                                        value="#1a1f2e"
                                    />
                                </div>
                                <div class="color-picker-item">
                                    <label>Panel</label>
                                    <input
                                        type="color"
                                        id="cPanel"
                                        value="#222838"
                                    />
                                </div>
                                <div class="color-picker-item">
                                    <label>Text</label>
                                    <input
                                        type="color"
                                        id="cText"
                                        value="#f0f4f8"
                                    />
                                </div>
                                <div
                                    class="color-picker-item"
                                    style="display: none"
                                >
                                    <label>Accent</label>
                                    <input
                                        type="color"
                                        id="cAccent"
                                        value="#5b8fd9"
                                    />
                                </div>
                                <div class="color-picker-item">
                                    <label>Accent Dark</label>
                                    <input
                                        type="color"
                                        id="cAccentDark"
                                        value="#4a7dc8"
                                    />
                                </div>
                            </div>
                            <div class="theme-editor-actions">
                                <button
                                    class="btn-cancel"
                                    onclick="closeCustomTheme()"
                                >
                                    Cancel
                                </button>
                                <button
                                    class="btn-apply"
                                    onclick="applyCustomTheme()"
                                >
                                    Apply
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Visual -->
                    <div class="settings-section">
                        <h3>Visual Effects</h3>
                        <div class="toggle-row">
                            <label class="toggle-label">
                                <input
                                    type="checkbox"
                                    id="glowToggle"
                                    checked=""
                                    onchange="toggleGlow()"
                                />
                                <span class="toggle-switch"></span>
                                <div class="toggle-info">
                                    <strong>Pulsing Glow Effects</strong>
                                    <small
                                        >Animated ring and button glows</small
                                    >
                                </div>
                            </label>
                        </div>
                    </div>

                    <!-- Audio -->
                    <div class="settings-section">
                        <h3>Audio Settings</h3>
                        <div class="toggle-row">
                            <label class="toggle-label">
                                <input
                                    type="checkbox"
                                    id="soundToggle"
                                    checked=""
                                    onchange="toggleSound()"
                                />
                                <span class="toggle-switch"></span>
                                <div class="toggle-info">
                                    <strong>Sound Effects</strong>
                                    <small>Button clicks and alerts</small>
                                </div>
                            </label>
                        </div>
                        <div class="slider-box">
                            <label>
                                <span class="slider-label-row">
                                    <svg
                                        data-slot="icon"
                                        fill="none"
                                        stroke-width="1.5"
                                        stroke="currentColor"
                                        viewBox="0 0 24 24"
                                        xmlns="http://www.w3.org/2000/svg"
                                        aria-hidden="true"
                                        class="vol-icon"
                                    >
                                        <path
                                            stroke-linecap="round"
                                            stroke-linejoin="round"
                                            d="M6 13.5V3.75m0 9.75a1.5 1.5 0 0 1 0 3m0-3a1.5 1.5 0 0 0 0 3m0 3.75V16.5m12-3V3.75m0 9.75a1.5 1.5 0 0 1 0 3m0-3a1.5 1.5 0 0 0 0 3m0 3.75V16.5m-6-9V3.75m0 3.75a1.5 1.5 0 0 1 0 3m0-3a1.5 1.5 0 0 0 0 3m0 9.75V10.5"
                                        ></path>
                                    </svg>
                                    Master Volume
                                </span>
                                <span id="volText">80%</span>
                            </label>
                            <input
                                type="range"
                                id="volSlider"
                                min="0"
                                max="100"
                                value="80"
                                oninput="updateVol(this.value)"
                            />
                        </div>
                        <div class="slider-box">
                            <label>
                                <span class="slider-label-row">
                                    <svg
                                        data-slot="icon"
                                        fill="none"
                                        stroke-width="1.5"
                                        stroke="currentColor"
                                        viewBox="0 0 24 24"
                                        xmlns="http://www.w3.org/2000/svg"
                                        aria-hidden="true"
                                        class="vol-icon"
                                    >
                                        <path
                                            stroke-linecap="round"
                                            stroke-linejoin="round"
                                            d="M6 13.5V3.75m0 9.75a1.5 1.5 0 0 1 0 3m0-3a1.5 1.5 0 0 0 0 3m0 3.75V16.5m12-3V3.75m0 9.75a1.5 1.5 0 0 1 0 3m0-3a1.5 1.5 0 0 0 0 3m0 3.75V16.5m-6-9V3.75m0 3.75a1.5 1.5 0 0 1 0 3m0-3a1.5 1.5 0 0 0 0 3m0 9.75V10.5"
                                        ></path>
                                    </svg>
                                    Sound Effects
                                </span>
                                <span id="sfxText">70%</span>
                            </label>
                            <input
                                type="range"
                                id="sfxSlider"
                                min="0"
                                max="100"
                                value="70"
                                oninput="updateSFX(this.value)"
                            />
                        </div>
                        <!-- Background Music Toggle (in Audio Settings) -->
                        <div class="toggle-row">
                            <label class="toggle-label">
                                <input
                                    type="checkbox"
                                    id="musicToggle"
                                    onchange="toggleMusic()"
                                />
                                <span class="toggle-switch"></span>
                                <div class="toggle-info">
                                    <strong>Background Music</strong>
                                    <small
                                        >Play ambient focus music from local
                                        file</small
                                    >
                                </div>
                            </label>
                        </div>
                        <div
                            class="slider-box"
                            id="musicBox"
                            style="display: none"
                        >
                            <label>
                                <span class="slider-label-row">
                                    <svg
                                        data-slot="icon"
                                        fill="none"
                                        stroke-width="1.5"
                                        stroke="currentColor"
                                        viewBox="0 0 24 24"
                                        xmlns="http://www.w3.org/2000/svg"
                                        aria-hidden="true"
                                        class="vol-icon"
                                    >
                                        <path
                                            stroke-linecap="round"
                                            stroke-linejoin="round"
                                            d="M6 13.5V3.75m0 9.75a1.5 1.5 0 0 1 0 3m0-3a1.5 1.5 0 0 0 0 3m0 3.75V16.5m12-3V3.75m0 9.75a1.5 1.5 0 0 1 0 3m0-3a1.5 1.5 0 0 0 0 3m0 3.75V16.5m-6-9V3.75m0 3.75a1.5 1.5 0 0 1 0 3m0-3a1.5 1.5 0 0 0 0 3m0 9.75V10.5"
                                        ></path>
                                    </svg>
                                    Music Volume
                                </span>
                                <span id="musicText">40%</span>
                            </label>
                            <input
                                type="range"
                                id="musicSlider"
                                min="0"
                                max="100"
                                value="40"
                                oninput="updateMusic(this.value)"
                            />
                        </div>
                        <!-- Custom Audio URL -->
                        <div class="audio-url-box">
                            <label>
                                <span class="audio-url-label">
                                    <svg
                                        width="16"
                                        height="16"
                                        viewBox="0 0 24 24"
                                        fill="none"
                                        stroke="currentColor"
                                        stroke-width="2"
                                    >
                                        <path d="M9 18V5l12-2v13" />
                                        <circle cx="6" cy="18" r="3" />
                                        <circle cx="18" cy="16" r="3" />
                                    </svg>
                                    Custom Audio URL
                                </span>
                                <div class="audio-url-input-row">
                                    <input
                                        type="text"
                                        id="audioUrlInput"
                                        placeholder="https://example.com/audio.mp3"
                                    />
                                    <button
                                        type="button"
                                        class="audio-url-btn"
                                        onclick="playAudioUrl()"
                                        title="Play"
                                    >
                                        Play
                                    </button>
                                    <button
                                        type="button"
                                        class="audio-url-btn"
                                        onclick="downloadAudioUrl()"
                                        title="Download"
                                    >
                                        Download
                                    </button>
                                </div>
                                <div
                                    class="audio-url-status"
                                    id="audioUrlStatus"
                                ></div>
                            </label>
                        </div>
                    </div>

                    <!-- Study Mode -->
                    <div class="settings-section">
                        <h3>Pomodoro / Study Mode</h3>
                        <div class="toggle-row">
                            <label class="toggle-label">
                                <input
                                    type="checkbox"
                                    id="studyToggle"
                                    onchange="toggleStudyFromSettings()"
                                />
                                <span class="toggle-switch"></span>
                                <div class="toggle-info">
                                    <strong>Enable Study Mode</strong>
                                    <small
                                        >25min focus / 5min break cycles</small
                                    >
                                </div>
                            </label>
                        </div>
                        <div class="toggle-row">
                            <label class="toggle-label">
                                <input
                                    type="checkbox"
                                    id="autoBreak"
                                    checked=""
                                />
                                <span class="toggle-switch"></span>
                                <div class="toggle-info">
                                    <strong>Auto-start Breaks</strong>
                                    <small
                                        >Automatically begin break timer</small
                                    >
                                </div>
                            </label>
                        </div>
                        <div class="toggle-row">
                            <label class="toggle-label">
                                <input
                                    type="checkbox"
                                    id="studyMusicToggle"
                                    onchange="toggleStudyMusic()"
                                />
                                <span class="toggle-switch"></span>
                                <div class="toggle-info">
                                    <strong>Auto-play During Study</strong>
                                    <small
                                        >Start background music automatically
                                        during study sessions</small
                                    >
                                </div>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="panel-footer">
                    <button
                        class="btn-secondary snd__button"
                        onclick="resetSettings()"
                    >
                        Reset to Default
                    </button>
                    <button
                        class="btn-primary snd__button"
                        onclick="closeSettings()"
                    >
                        Done
                    </button>
                </div>
            </div>
        </div>

        <!-- Color Wheel Modal -->
        <div class="color-wheel-overlay" id="colorWheelOverlay">
            <div class="color-wheel-modal">
                <div class="color-wheel-header">
                    <h3>Color Picker</h3>
                    <button class="close-btn" onclick="closeColorWheel()">
                        ×
                    </button>
                </div>
                <div class="color-wheel-body">
                    <div class="cw-top">
                        <div class="cw-wheel-wrap">
                            <canvas
                                id="cwWheel"
                                width="200"
                                height="200"
                            ></canvas>
                        </div>
                        <div class="cw-sliders">
                            <div class="cw-slider-row">
                                <label>H</label>
                                <div class="cw-slider-track" id="cwHueTrack">
                                    <div
                                        class="cw-slider-fill"
                                        id="cwHueFill"
                                        style="
                                            background: linear-gradient(
                                                to right,
                                                #f00,
                                                #ff0,
                                                #0f0,
                                                #0ff,
                                                #00f,
                                                #f0f,
                                                #f00
                                            );
                                        "
                                    ></div>
                                    <div
                                        class="cw-slider-thumb"
                                        id="cwHueThumb"
                                        style="left: 0%"
                                    ></div>
                                </div>
                            </div>
                            <div class="cw-slider-row">
                                <label>S</label>
                                <div class="cw-slider-track" id="cwSatTrack">
                                    <div
                                        class="cw-slider-fill"
                                        id="cwSatFill"
                                        style="
                                            background: linear-gradient(
                                                to right,
                                                #808080,
                                                #f00
                                            );
                                        "
                                    ></div>
                                    <div
                                        class="cw-slider-thumb"
                                        id="cwSatThumb"
                                        style="left: 100%"
                                    ></div>
                                </div>
                            </div>
                            <div class="cw-slider-row">
                                <label>V</label>
                                <div class="cw-slider-track" id="cwValTrack">
                                    <div
                                        class="cw-slider-fill"
                                        id="cwValFill"
                                        style="
                                            background: linear-gradient(
                                                to right,
                                                #000,
                                                #f00
                                            );
                                        "
                                    ></div>
                                    <div
                                        class="cw-slider-thumb"
                                        id="cwValThumb"
                                        style="left: 100%"
                                    ></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="cw-preview-section">
                        <div
                            class="cw-preview"
                            id="cwPreview"
                            style="background: #5b8fd9"
                        ></div>
                        <div class="cw-values">
                            <div class="cw-value">
                                <span>HEX</span><input id="cwHex" readonly />
                            </div>
                            <div class="cw-value">
                                <span>RGB</span><input id="cwRgb" readonly />
                            </div>
                            <div class="cw-value">
                                <span>CMYK</span><input id="cwCmyk" readonly />
                            </div>
                            <div class="cw-value">
                                <span>HSV</span><input id="cwHsv" readonly />
                            </div>
                            <div class="cw-value">
                                <span>HSL</span><input id="cwHsl" readonly />
                            </div>
                        </div>
                    </div>
                </div>
                <div class="color-wheel-footer">
                    <button class="cw-btn-cancel" onclick="closeColorWheel()">
                        Cancel
                    </button>
                    <button class="cw-btn-apply" onclick="applyColorWheel()">
                        Apply
                    </button>
                </div>
            </div>
        </div>

        <!-- App -->
        <div class="app">
            <!-- Navigation -->
            <nav class="nav">
                <div class="nav-tabs">
                    <button
                        class="tab-btn active snd__button"
                        id="timerTab"
                        onclick="switchMode('timer')"
                    >
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2.5"
                        >
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                        <span>Timer</span>
                    </button>
                    <button
                        class="tab-btn snd__button"
                        id="stopwatchTab"
                        onclick="switchMode('stopwatch')"
                    >
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2.5"
                        >
                            <circle cx="12" cy="13" r="9"></circle>
                            <polyline points="12 7 12 13 15 15"></polyline>
                            <path d="M9 3h6"></path>
                        </svg>
                        <span>Stopwatch</span>
                    </button>
                </div>
                <div class="nav-actions">
                    <button
                        class="action-btn snd__button"
                        onclick="toggleLightMode()"
                        title="Toggle theme"
                    >
                        <svg
                            id="lightIcon"
                            xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.5"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"
                            />
                        </svg>
                        <span id="lightLabel">Light</span>
                    </button>
                    <button
                        class="action-btn"
                        onclick="toggleMute()"
                        title="Toggle sound"
                    >
                        <svg
                            id="muteIcon"
                            xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 24 24"
                            fill="currentColor"
                        >
                            <path
                                d="M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.508c-1.141 0-2.318.664-2.66 1.905A9.76 9.76 0 0 0 1.5 12c0 .898.121 1.768.35 2.595.341 1.24 1.518 1.905 2.659 1.905h1.93l4.5 4.5c.945.945 2.561.276 2.561-1.06V4.06ZM18.584 5.106a.75.75 0 0 1 1.06 0c3.808 3.807 3.808 9.98 0 13.788a.75.75 0 0 1-1.06-1.06 8.25 8.25 0 0 0 0-11.668.75.75 0 0 1 0-1.06Z"

                    <button

                        onclick="openSettings()"
                    >
                        <svg

                            fill="currentColor"

                        <span>Settings</span>
                    </button>
                </div>
            </nav>

            <!-- Study Banner -->
            <div class="study-banner" id="studyBanner" style="display: none">
                <div class="study-info">
                    <div class="study-phase" id="studyPhase">Focus Session</div>
                    <div class="study-session" id="studySession">Session 1</div>
                </div>
            </div>

            <!-- Main Content -->
            <main class="main">
                <div id="timerView">
                    <!-- Rendered by JS -->
                </div>
                <div id="stopwatchView" style="display: none">
                    <!-- Rendered by JS -->
                </div>
            </main>
        </div>

        <!-- Play Controls -->
        <div class="play-zone">
            <button
                class="reset-play-btn snd__button"
                id="resetBtn"
                onclick="resetApp()"
                title="Reset"
            >
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.5"
                >
                    <polyline points="23 4 23 10 17 10"></polyline>
                    <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                </svg>
            </button>
            <button
                class="play-btn snd__celebration"
                id="playBtn"
                onclick="togglePlay()"
            >
                <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor">
                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
            </button>
        </div>

        <!-- Notification -->
        <div class="notification" id="notification">
            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
            >
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            <span id="notifText">Complete!</span>
        </div>

        <!-- Audio -->
        <audio
            id="chime"
            src="https://cdn.pixabay.com/audio/2022/03/15/audio_91c6c7c6a7.mp3"
        ></audio>
        <audio id="bgMusic" loop="" src="./background_music.mp3"></audio>

        <script src="./script.js"></script>
    </body>
</html>
